# LOTN is still under active development.

schema-version: 7
debug: false

armor:
  reduction-scaling: 250.0
  maximum-reduction: 0.70
  mitigated-causes:
    - ENTITY_ATTACK
    - ENTITY_SWEEP_ATTACK
    - PROJECTILE
    - ENTITY_EXPLOSION
    - BLOCK_EXPLOSION
  unmitigated-causes:
    - VOID
    - KILL
    - SONIC_BOOM

quality:
  levels:
    0:
      name: "Normal"
      base-percentage: 0.00
      material-cost: 0
    1:
      name: "Fine"
      base-percentage: 0.04
      material-cost: 1
    2:
      name: "Superior"
      base-percentage: 0.08
      material-cost: 1
    3:
      name: "Exquisite"
      base-percentage: 0.13
      material-cost: 2
    4:
      name: "Flawless"
      base-percentage: 0.19
      material-cost: 2
    5:
      name: "Epic"
      base-percentage: 0.26
      material-cost: 3
    6:
      name: "Legendary"
      base-percentage: 0.35
      material-cost: 4

tempering:
  enabled: true
  armor-weight-increase-per-quality-rank: 0.025
  formula:
    smithing-bonus-per-level: 0.005
    minimum-increase: 0.005
    maximum-bonus: 0.75
  wooden:
    maximum-quality-rank: 1
    maximum-bonus: 0.08
  smithing-xp:
    base: 6.0
    material-tier-multiplier: 0.35
    quality-rank-multiplier: 0.30
    material-cost-multiplier: 0.25
  migration:
    legacy-rank-percentages:
      0: 0.00
      1: 0.04
      2: 0.08
      3: 0.12
      4: 0.16
      5: 0.20
  messages:
    disabled: "Tempering is turned off."
    unsupported: "That item can't be tempered."
    stacked: "Temper one item at a time."
    legendary: "This item is already Legendary."
    wood-maximum: "Wooden equipment can't be tempered beyond {quality}."
    maximum: "This item is already at its maximum quality ({quality})."
    unavailable: "You can't temper equipment right now."
    category: "Only weapons and armor can be upgraded."
    material-family: "{material} equipment can't be upgraded."
    skill: "You need Smithing {required}."
    material: "You need {amount} {material}."
    amount: "You don't have enough {material}. You need {amount}."
    unsafe-click: "Take tempered items with a normal empty-cursor click."
    cursor: "Empty your cursor before taking the tempered item."
    result-changed: "The anvil result changed. Put the items back in and try again."
    success: "Tempered to &6{quality}&7 (&b+{percentage}%&7)."
  sounds:
    success:
      name: "block.anvil.use"
      volume: 0.8
      pitch: 1.15

