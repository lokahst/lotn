# Note:
# You're using first versions of stable releases. Please note that this plugin
# is still under development.

schema-version: 21

migration:
  old-data-policy: ARCHIVE_AND_RESET
  percentage-source-max-level: 100

multipliers:
  global: 1.0
  server-event: 1.0
  worlds: {}
  permissions: {}
  mob-types: {}
  mob-tiers:
    1: 1.0
    2: 1.08
    3: 1.16
    4: 1.24
    5: 1.32
    6: 1.40

debug:
  enabled: false

item-progression:
  enabled: true
  max-level: 100
  weapon:
    experience-per-kill: 1.0
    experience-per-level: 1.0
  armor:
    experience-per-damage: 1.0
    experience-per-level: 10.0

anti-exploit:
  maximum-single-xp-gain: 10000
  allow-pvp-xp: false
  allow-friendly-targets: false
  allow-player-spawned-mobs: false
  allow-environmental-armor-xp: false
  allow-dispenser-projectile-xp: false
  excluded-entities: [ARMOR_STAND]
  player-spawned-multiplier: 0.25
  low-level-mob:
    enabled: true
    full-xp-level-gap: 5
    reduction-per-level: 0.05
    minimum-multiplier: 0.20
  repeated-target:
    enabled: true
    window-millis: 30000
    full-xp-actions: 6
    reduction-per-action: 0.12
    minimum-multiplier: 0.15
  movement:
    afk-after-seconds: 120
    minimum-distance: 0.20
    maximum-segment-distance: 8.0
    repeated-cell-window: 12
  trading:
    resale-window-seconds: 120
    repeat-window-seconds: 60
    full-xp-transactions: 3
    minimum-multiplier: 0.10

notifications:
  xp-gain-chat: false
  xp-gain-message: "&7+{amount} {skill} XP ({source})"
  xp-action-bar:
    enabled: true
    hold-millis: 1800
    message: "&a+{amount} {skill} XP &8• &6Lv. {level} &e{current_xp}&7/&e{required_xp}"
  chat:
    enabled: true
    message: "&a{skill} increased to Level {level}!\n&6Unlocked: &e{reward}\n&7{description}"
  action-bar:
    enabled: false
    message: "&6{skill} {level}: &e{reward}"
  title:
    enabled: false
    title: "&6{skill} {level}"
    subtitle: "&e{reward}"
  sound:
    enabled: true
    name: ui.toast.challenge_complete
    volume: 0.7
    pitch: 1.2
  particles:
    enabled: true
    type: END_ROD
    amount: 12

categories:
  combat:
    display-name: "Combat"
    icon: IRON_SWORD
    description: "Weapon, blocking, and armor mastery."
  crafting_gathering:
    display-name: "Crafting & Gathering"
    icon: CRAFTING_TABLE
    description: "Create, improve, harvest, and discover."
  utility:
    display-name: "Utility"
    icon: COMPASS
    description: "Travel, trade, and practical expertise."

gui:
  progress-bar-length: 10
  unlocked-material: LIME_STAINED_GLASS_PANE
  locked-material: GRAY_STAINED_GLASS_PANE
  category-slots: [20, 22, 24]
  skill-slots: [10, 12, 14, 16, 28, 30]
  rewards-per-page: 28

integrations:
  requirements:
    alchemy-splash:
      enabled: false
    alchemy-lingering:
      enabled: false
    rotating-merchant-offers:
      enabled: false
  economy:
    supported-shop-enabled: true
    sale-price-must-not-exceed-purchase-price: true
  headshots:
    upper-hitbox-fraction: 0.28
    excluded-entities: [ENDER_DRAGON, WITHER]
  fast-travel:
    preparation-seconds: 5
    cooldown-seconds: 30
    nearby-hostile-radius: 12
    damage-lock-seconds: 8
    region-provider: NONE
  armor:
    heavy-material-prefixes: [CHAINMAIL, IRON, DIAMOND, NETHERITE]
    light-material-prefixes: [LEATHER]
  farming:
    automatic-replant-default: true
  alchemy:
    base-brewing-seconds: 5.0
  mining:
    valid-tool-suffixes: [AXE, PICKAXE]
  fishing:
    legendary-base-chance: 0.002
    mythic-base-chance: 0.0002

xp-values:
  combat:
    per-damage: 0.70
    maximum-per-hit: 12.0
    kill-bonus-per-max-health: 0.08
    maximum-kill-bonus: 6.0
    critical-bonus: 0.10
    boss-bonus: 1.5
    mob-tier-bonus: 0.08
  archery:
    distance-bonus-per-block: 0.01
    maximum-distance-bonus: 1.0
    headshot-bonus: 1.25
    moving-target-bonus: 1.10
    moving-target-minimum-speed: 0.08
  unarmed:
    combo-percent-per-hit: 0.05
    combo-maximum-percent: 0.20
    combo-window-millis: 2000
    armored-target-multiplier: 1.15
    boss-multiplier: 1.50
  blocking:
    per-damage-prevented: 0.90
    perfect-block: 4.0
    projectile-block: 2.0
    shield-bash: 3.0
    maximum-per-hit: 12.0
  armor:
    per-damage: 0.45
    maximum-per-hit: 8.0
    encounter-survival: 5.0
    valid-causes: [ENTITY_ATTACK, ENTITY_SWEEP_ATTACK, PROJECTILE, ENTITY_EXPLOSION]
  smithing:
    crafting-base: 1.0
    repair-per-durability: 0.05
    useful-smelt: 1.0
    equipment-upgrade: 8.0
  enchanting:
    discovery: 12.0
    enchanted-drop: 5.0
    tier-multiplier: 1.5
    activation: 0.5
  alchemy:
    brewing: 12.0
    quality-tier-multiplier: 1.25
    first-recipe: 8.0
    study-success: 6.0
    useful-use: 2.0
  mining:
    first-natural-material: 5.0
    dangerous-depth-maximum-y: 0
    natural-blocks:
      COAL_ORE: 1.0
      COPPER_ORE: 1.2
      IRON_ORE: 1.5
      GOLD_ORE: 2.0
      REDSTONE_ORE: 1.8
      LAPIS_ORE: 2.0
      DIAMOND_ORE: 4.0
      EMERALD_ORE: 5.0
      NETHER_GOLD_ORE: 1.5
      NETHER_QUARTZ_ORE: 1.2
      ANCIENT_DEBRIS: 8.0
    deepslate-multiplier: 1.20
    dangerous-depth-multiplier: 1.15
  farming:
    mature-harvest: 2.0
    planting: 0.25
    first-crop-type: 5.0
    breeding: 4.0
    animal-product: 1.0
    farm-sale-per-value: 0.02
  fishing:
    base-catch: 4.0
    treasure: 8.0
    first-species: 12.0
    legendary: 25.0
  wayfaring:
    distance-per-block: 0.02
    biome-discovery: 15.0
    new-bed: 10.0
    dimension: 30.0
    destination-reached: 8.0
  trading:
    per-value: 0.02
    merchant-variety: 5.0
    large-transaction-minimum-value: 64.0
    large-transaction: 10.0

