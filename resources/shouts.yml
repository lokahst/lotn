  minimum-level: 80
  allowed-tiers: [5, 6]
  spawn-chance: 0.015
  allowed-sources: [NATURAL, CHUNK_GEN, PATROL, REINFORCEMENTS, DEFAULT]
  word-two-level: 120
  word-three-level: 180
  both-shouts-chance: 0.25
  show-name-marker: true
  cooldown-seconds: 20
  telegraph-ticks: 36
  maximum-range: 18
  unrelenting-force:
    enabled: true
    damage-by-words: [3.0, 5.0, 7.0]
    knockback-by-words: [0.75, 1.05, 1.35]
    cone-range-by-words: [7.0, 9.0, 11.0]
    stagger-ticks-by-words: [12, 20, 30]
  fire-breath:
    enabled: true
    damage-by-words: [3.0, 5.0, 7.0]
    fire-ticks-by-words: [50, 90, 130]
    cone-range-by-words: [7.0, 9.0, 11.0]

