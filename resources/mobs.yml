hologram:
  enabled: true
  show-on-hostile-mobs: true
  show-on-passive-mobs: true
  show-on-neutral-mobs: true
  show-on-bosses: true
  suppress-native-nameplate: true
  visibility-range: 32.0
  visibility:
    poll-interval-ticks: 1
    look-enabled: true
    look-range: 8.0
    ray-size: 0.15
    look-retain-ms: 2000
    combat-enabled: true
    combat-retain-ms: 8000
    minimum-view-distance: 0.75
    hide-when-camera-inside: true
  show-level: true
  show-health: true
  level-generation:
    minimum: 1
    maximum: 80
    default-level: 1
    nearest-player-enabled: true
    player-level-influence: 0.35
    random-spread: 2
    world-environment-base:
      normal: 1
      nether: 20
      the_end: 35
      custom: 1
  format:
    name-line: "&c{name} &8• &7Lv. &f{level}"
    name-only-line: "&c{name}"
  health-bar:
    segments: 10
    left: ""
    filled: "&a&m "
    missing: "&c&m "
    right: ""
  style:
    billboard: VERTICAL
    vertical-offset: 0.35
    scale: 0.8
    see-through: false
    shadowed: true
    line-width: 160
    display-width: 2.5
    display-height: 1.0
    view-range: 1.0
    shadow-radius: 0.0
    shadow-strength: 0.0
    background:
      alpha: 0
      red: 15
      green: 15
      blue: 18

armor:
  enabled: true
  minimum-tier: 4
  default:
    helmet: CHAINMAIL_HELMET
    chestplate: CHAINMAIL_CHESTPLATE
    leggings: CHAINMAIL_LEGGINGS
    boots: CHAINMAIL_BOOTS

equipment-profiles:
  tier-4:
    helmet: CHAINMAIL_HELMET
    chestplate: CHAINMAIL_CHESTPLATE
    leggings: CHAINMAIL_LEGGINGS
    boots: CHAINMAIL_BOOTS
  tier-5:
    helmet: IRON_HELMET
    chestplate: IRON_CHESTPLATE
    leggings: IRON_LEGGINGS
    boots: IRON_BOOTS
  tier-6:
    helmet: DIAMOND_HELMET
    chestplate: DIAMOND_CHESTPLATE
    leggings: DIAMOND_LEGGINGS
    boots: DIAMOND_BOOTS

rewards:
  base-kill-experience: 8.0
  experience-per-mob-level: 1.2
  farmed-spawn-multiplier: 0.15
  farmed-spawns-count-for-quests: false
  rank-multipliers:
    normal: 1.0
    common: 1.0
    uncommon: 1.1
    strong: 1.35
    elite: 2.25
    champion: 4.0
    legendary: 6.0
    boss: 8.0