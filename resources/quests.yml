        target: "milestone:deep_underground"
        amount: 1
        description: "Discover the Deep Roads"
      mine_redstone:
        type: MINE
        target: DEEPSLATE_REDSTONE_ORE
        amount: 16
        description: "Mine deepslate redstone ore"
