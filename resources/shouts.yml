# LOTN is still under active development.

schema-version: 2

framework:
  default-unlocked-words: 1
  global-cooldown: false

voice-knowledge:
  rewards:
    quest: 1
    main-quest: 2
    achievement: 1
    discovery: 1
    level-interval: 5
    level-milestone: 1
    elite-minimum-level: 30
    high-tier-enemy: 1
    voice-bearer: 2
    dragon: 3
    boss: 2

voice-bearers:
