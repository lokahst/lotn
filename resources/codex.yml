# LOTN is still under active development.

schema-version: 3
enabled: true

main:
  title: "&8Northern Codex"
  profile:
    slot: 4
    material: PLAYER_HEAD
    name: "&6&lCharacter Record"
  statistics:
    character_name: {label: "Character"}
    player_level: {label: "Overall Level"}
    legacy_rank: {label: "Legacy Rank"}
    playtime: {label: "Playtime"}
    difficulty: {label: "Difficulty"}
    legendary_skills: {label: "Legendary Skills"}
    completion: {label: "Codex Completion"}

pages:
  world:
    slot: 10
    material: COMPASS
    name: "&a&lWorld"
    title: "&8Codex: World"
    lore: ["&7Review the places you've found", "&7across the world.", "", "&eClick to open"]
    statistics:
      biomes: {label: "Biomes Discovered", material: GRASS_BLOCK}
      overworld_biomes: {label: "Overworld Biomes", material: OAK_SAPLING}
      nether_biomes: {label: "Nether Biomes", material: NETHERRACK}
      villages: {label: "Villages Discovered", material: BELL}
      dimensions: {label: "Dimensions Visited", material: ENDER_EYE}
  combat:
    slot: 11
    material: IRON_SWORD
    name: "&c&lCombat"
    title: "&8Codex: Combat"
    lore: ["&7Review battles, damage,", "&7boss kills, and deaths.", "", "&eClick to open"]
    default-stat-material: IRON_SWORD
    statistics:
      mobs_killed: {label: "Total Mobs Killed", material: IRON_SWORD}
      normal_mobs: {label: "Normal Mobs", material: STONE_SWORD}
