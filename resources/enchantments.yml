# Note:
# You're using first versions of stable releases. Please note that this plugin
# is still under development.

schema-version: 1
debug: false

tiers:
  1:
    display-name: "Tier I"
    color: GRAY
    required-level: 1
    weight: 45
  2:
    display-name: "Tier II"
    color: GREEN
    required-level: 5
    weight: 27
  3:
    display-name: "Tier III"
    color: AQUA
    required-level: 10
    weight: 16
  4:
    display-name: "Tier IV"
    color: LIGHT_PURPLE
    required-level: 15
    weight: 9
  5:
    display-name: "Tier V"
    color: GOLD
    required-level: 20
    weight: 3

compatibility:
  weapon-display: ["Swords", "Axes", "Bows", "Crossbows"]
  armor-display: ["Helmets", "Chestplates", "Leggings", "Boots"]
  # Bukkit material names: Tridents, maces, and plugin weapons are opt-in
  additional-weapons: []

drops:
  worlds:
    default-enabled: true
    # world_nether:
    #   enabled: false
  mob-blacklist: []
  # per-entity overrides, keyed by exact Bukkit entity type
  mobs: {}
  # ZOMBIE:
  #   enabled: true
  #   chance-multiplier: 1.0
  item-blacklist: []
  disabled-enchantments: []
  world-boss-entity-types: [ENDER_DRAGON]
  non-player-drops:
    enabled: false
    maximum-tier: 1
  generated-equipment:
    enabled: false
    materials: [IRON_SWORD, IRON_AXE, BOW, CROSSBOW, IRON_HELMET, IRON_CHESTPLATE, IRON_LEGGINGS, IRON_BOOTS]
  classifications:
    normal:
      chance: 0.0025
      minimum-tier: 1
      tier-weight-multipliers: {1: 1.35, 2: 0.85, 3: 0.55, 4: 0.25, 5: 0.10}
    strong:
      chance: 0.005
      minimum-tier: 1
      tier-weight-multipliers: {1: 0.90, 2: 1.25, 3: 1.00, 4: 0.55, 5: 0.25}
    elite:
      chance: 0.015
      minimum-tier: 1
      tier-weight-multipliers: {1: 0.45, 2: 1.20, 3: 1.45, 4: 1.30, 5: 0.65}
    boss:
      chance: 0.05
      minimum-tier: 1
      tier-weight-multipliers: {1: 0.20, 2: 0.65, 3: 1.35, 4: 1.65, 5: 1.45}
    world-boss:
      chance: 1.0
      minimum-tier: 3
      tier-weight-multipliers: {1: 0.05, 2: 0.25, 3: 1.20, 4: 1.75, 5: 2.00}
  mob-families: {}
  permission-modifiers: {}
  # example:
  #   patron:
  #     permission: lotn.enchantments.drop.patron
  #     multiplier: 1.10

skill-modifiers:
  drop-chance-per-level: 0.02
  highest-tier-weight-per-level: 0.01
  strength-per-level: 0.0
  second-enchantment-unlock-level: 10
  second-enchantment-base-chance: 0.03
  second-enchantment-per-level: 0.01
  triple-enchantment-unlock-level: 20
  triple-enchantment-chance: 0.01
  cooldown-reduction-per-level: 0.005

armor-caps:
  vitality-health: 12.0
  fortification-reduction: 0.14
  agility-movement-speed: 0.10
  agility-stamina-regeneration: 0.08
  thorns-chance: 0.24

physical-damage-causes: [ENTITY_ATTACK, ENTITY_SWEEP_ATTACK, PROJECTILE]

immunities:
  fire:
    respect-fire-resistance: true
    resistant-damage-multiplier: 0.25
    lotn-dragon-damage-multiplier: 0.0
    entity-types: [BLAZE, MAGMA_CUBE, STRIDER]
  poison:
    configured-bosses: true
    entity-types: [ZOMBIE, HUSK, DROWNED, ZOMBIE_VILLAGER, SKELETON, STRAY, WITHER_SKELETON, WITHER, ZOMBIFIED_PIGLIN, PHANTOM]

discovery:
  enabled: true
  hide-undiscovered-details: true
  skill-xp: 12.0

families:
  fire:
    display-name: "Fire"
    icon: BLAZE_POWDER
    cooldown-ticks: 0
    tiers:
      1: {chance: 0.10, damage: 2.0, duration-seconds: 2.0}
      2: {chance: 0.12, damage: 4.0, duration-seconds: 3.0}
      3: {chance: 0.15, damage: 6.0, duration-seconds: 4.0}
      4: {chance: 0.18, damage: 9.0, duration-seconds: 5.0}
      5: {chance: 0.22, damage: 12.0, duration-seconds: 6.0}
  poison:
    display-name: "Poison"
    icon: SPIDER_EYE
    cooldown-ticks: 0
    tiers:
      1: {chance: 0.08, damage: 3.0, duration-seconds: 3.0, healing-reduction: 0.0}
      2: {chance: 0.10, damage: 5.0, duration-seconds: 4.0, healing-reduction: 0.0}
      3: {chance: 0.12, damage: 8.0, duration-seconds: 5.0, healing-reduction: 0.0}
      4: {chance: 0.15, damage: 12.0, duration-seconds: 6.0, healing-reduction: 0.0}
      5: {chance: 0.18, damage: 16.0, duration-seconds: 8.0, healing-reduction: 0.20}
  slowness:
    display-name: "Slowness"
    icon: BLUE_ICE
    cooldown-ticks: 0
    tiers:
      1: {chance: 0.10, speed-reduction: 0.10, duration-seconds: 2.0, prevent-sprinting: false}
      2: {chance: 0.12, speed-reduction: 0.15, duration-seconds: 2.5, prevent-sprinting: false}
      3: {chance: 0.15, speed-reduction: 0.20, duration-seconds: 3.0, prevent-sprinting: false}
      4: {chance: 0.18, speed-reduction: 0.25, duration-seconds: 3.5, prevent-sprinting: false}
      5: {chance: 0.20, speed-reduction: 0.30, duration-seconds: 4.0, prevent-sprinting: true}
  shock:
    display-name: "Shock"
    icon: LIGHTNING_ROD
    cooldown-ticks: 0
    tiers:
      1: {chance: 0.08, damage: 2.0, resource-drain: 4.0, arc-targets: 0, arc-damage: 0.0, arc-radius: 5.0}
      2: {chance: 0.10, damage: 3.0, resource-drain: 6.0, arc-targets: 0, arc-damage: 0.0, arc-radius: 5.0}
      3: {chance: 0.12, damage: 5.0, resource-drain: 8.0, arc-targets: 0, arc-damage: 0.0, arc-radius: 5.0}
      4: {chance: 0.15, damage: 7.0, resource-drain: 12.0, arc-targets: 1, arc-damage: 3.0, arc-radius: 5.0}
      5: {chance: 0.18, damage: 10.0, resource-drain: 16.0, arc-targets: 2, arc-damage: 5.0, arc-radius: 5.0}
  vitality:
    display-name: "Vitality"
    icon: GOLDEN_APPLE
    tiers:
      1: {maximum-health: 0.5}
      2: {maximum-health: 1.0}
      3: {maximum-health: 1.5}
      4: {maximum-health: 2.0}
      5: {maximum-health: 3.0}
  fortification:
    display-name: "Fortification"
    icon: IRON_CHESTPLATE
    tiers:
      1: {physical-reduction: 0.01}
      2: {physical-reduction: 0.015}
      3: {physical-reduction: 0.02}
      4: {physical-reduction: 0.025}
      5: {physical-reduction: 0.035}
  agility:
    display-name: "Agility"
    icon: FEATHER
    tiers:
      1: {movement-speed: 0.005, stamina-regeneration: 0.0}
      2: {movement-speed: 0.01, stamina-regeneration: 0.0}
      3: {movement-speed: 0.015, stamina-regeneration: 0.0}
      4: {movement-speed: 0.02, stamina-regeneration: 0.0}
      5: {movement-speed: 0.025, stamina-regeneration: 0.02}
  thorns:
    display-name: "Thorns"
    icon: SWEET_BERRIES
    tiers:
      1: {chance: 0.02, damage: 1.0, stagger-ticks: 0}
      2: {chance: 0.03, damage: 2.0, stagger-ticks: 0}
      3: {chance: 0.04, damage: 3.0, stagger-ticks: 0}
      4: {chance: 0.05, damage: 4.0, stagger-ticks: 0}
      5: {chance: 0.06, damage: 6.0, stagger-ticks: 10}

lore:
  header: "&5&lLOTN Enchantments"

gui:
  main-title: "&5&lLOTN Enchantments"
  tier-slots: [11, 13, 15, 21, 23]
  enchantment-slots: [10, 11, 12, 13, 14, 15, 16, 22]
  info-slot: 40
  summary-slot: 40
  previous-tier-slot: 47
  back-slot: 49
  next-tier-slot: 51
  filler: LIGHT_GRAY_STAINED_GLASS_PANE
  unlocked-tier-icon: ENCHANTED_BOOK
  locked-tier-icon: GRAY_STAINED_GLASS_PANE
  open-sound: BLOCK_ENCHANTMENT_TABLE_USE

visuals:
  enabled: true
  proc-particle-count: 16
  families:
    fire: {particle: FLAME, sound: ITEM_FIRECHARGE_USE}
    poison: {particle: WITCH, sound: ENTITY_SPIDER_HURT}
    slowness: {particle: SNOWFLAKE, sound: BLOCK_GLASS_BREAK}
    shock: {particle: ELECTRIC_SPARK, sound: ENTITY_LIGHTNING_BOLT_IMPACT}

messages:
  discovered: "Discovered {enchantment}."