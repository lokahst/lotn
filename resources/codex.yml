    name: "&f&lSurvival"
    title: "&8Codex: Survival"
    lore: ["&7Review cold exposure, injuries,", "&7and fast travel.", "", "&eClick to open"]
    default-stat-material: CAMPFIRE
    statistics:
      frostbite: {label: "Frostbite Incidents", material: BLUE_ICE}
      broken_legs: {label: "Broken Legs", material: BONE}
