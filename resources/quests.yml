# LOTN is still under active development.

schema-version: 9

settings:
  maximum-active-quests: 5

tier-boundaries:
  basic: 1
  trained: 20
  advanced: 40
  expert: 60
  master: 80
  legendary: 100

boss-contribution:
  wither:
    minimum-personal: 0.35
  dragon:
    minimum-personal: 0.18
    minimum-presence-fraction: 0.20

legacy-scaling:
  quest-difficulty-per-rank: 0.10
  quest-difficulty-cap: 1.50

migration:
  unmapped-active-quest-compensation-xp: 0.0

quests:
  main_ender_dragon:
    enabled: true
    display-name: "Main Quest: Kill the Ender Dragon"
    icon: DRAGON_HEAD
    category: main
    description:
      - "Take this quest before the dragon fight begins."
      - "If the first dragon is gone, bring it back with End Crystals."
    objectives:
      defeat_dragon:
        type: DRAGON_ENCOUNTER
        target: ENDER_DRAGON
        amount: 1
        description: "Help defeat the Ender Dragon"
        minimum-contribution: 0.18
        minimum-presence-fraction: 0.20
    rewards:
      experience: 5000
      skill-xp:
        one_handed: 200
        archery: 100

  adventure_iron_road:
    enabled: true
    display-name: "The Iron Road"
    icon: IRON_INGOT
    category: adventure
    ordered: true
    description:
      - "Mine some iron, smelt it, and make a new weapon."
    objectives:
      gather_ore:
        type: MINE
        target: "IRON_ORE|DEEPSLATE_IRON_ORE"
        amount: 20
        description: "Mine iron ore"
      refine_iron:
        type: SMELT
        target: IRON_INGOT
        amount: 16
        description: "Smelt iron ingots"
      forge_weapon:
        type: CRAFT
        target: WEAPON
        amount: 1
        description: "Craft a weapon"
    rewards:
      experience: 180
      skill-xp:
        smithing: 65
      items:
        - "IRON_INGOT:8"

  adventure_deep_roads:
